  <script>
    // Enforce title immediately to prevent stale browser tab title caching
    document.title = "Sai International Couriers & Cargo | Worldwide Air Cargo & NRI Logistics";
    // Unregister legacy Service Workers from other localhost projects (e.g. MS Billings)
    if ('serviceWorker' in navigator && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      const errDiv = document.createElement('div');
      errDiv.style.position = 'fixed';
      errDiv.style.top = '0';
      errDiv.style.left = '0';
      errDiv.style.width = '100vw';
      errDiv.style.height = '100vh';
      errDiv.style.backgroundColor = 'rgba(255,0,0,0.8)';
      errDiv.style.color = 'white';
      errDiv.style.zIndex = '999999';
      errDiv.style.padding = '2rem';
      errDiv.style.overflow = 'auto';
      errDiv.innerHTML = `<h2>Unhandled Error</h2><pre>${error ? error.stack : message}</pre>`;
      document.body.appendChild(errDiv);
    };
  </script>

  <!-- Google Translate Element (Hidden by CSS) -->
